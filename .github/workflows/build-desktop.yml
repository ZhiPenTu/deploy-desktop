name: Build desktop installers

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ui:
    name: 界面自动化测试
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check commands and progress events
        run: npm run check:commands

      - name: Test desktop API boundary
        run: npm run test:api

      - name: Test interface
        run: npm run test:e2e

      - name: Upload failure report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS DMG (Apple Silicon)
            os: macos-15
            artifact: macos
            bundles: dmg
          - name: Windows NSIS and MSI
            os: windows-latest
            artifact: windows
            bundles: nsis,msi
          - name: Linux AppImage and DEB
            os: ubuntu-22.04
            artifact: linux
            bundles: appimage,deb
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libssl-dev \
            librsvg2-dev \
            patchelf

      - name: Install npm dependencies
        run: npm ci

      - name: Check UI text
        run: npm run check:ui-text

      - name: Build frontend
        run: npm run build

      - name: Test desktop API boundary
        run: npm run test:api

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build installers
        run: npx tauri build --bundles ${{ matrix.bundles }} --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Upload installers
        uses: actions/upload-artifact@v5
        with:
          name: deploy-desktop-${{ matrix.artifact }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
